name: Build APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install unzip
    run: sudo apt-get update && sudo apt-get install -y unzip

  - name: Extract Android project
    run: |
      mkdir -p extracted
      unzip -o FFScreenLab-GitHub-Build.zip -d extracted

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v6
    with:
      gradle-version: '8.10.2'

  - name: Build APK
    run: |
      PROJECT_FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

      if [ -z "$PROJECT_FILE" ]; then
        echo "ERROR: Gradle project not found"
        exit 1
      fi

      PROJECT_DIR=$(dirname "$PROJECT_FILE")
      cd "$PROJECT_DIR"

      cat > force-java17.gradle <<'EOF'
      allprojects {
          tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
              sourceCompatibility = '17'
              targetCompatibility = '17'
          }
          tasks.configureEach {
              if (name.toLowerCase().contains("kotlin")) {
                  try {
                      if (hasProperty("kotlinOptions")) {
                          kotlinOptions.jvmTarget = "17"
                      }
                  } catch (ignored) {}
              }
          }
      }
      EOF

      gradle -I force-java17.gradle assembleDebug --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: FFScreenLab-APK
      path: extracted/**/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error