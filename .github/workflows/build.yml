name: Build APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install unzip
    run: sudo apt-get update && sudo apt-get install -y unzip

  - name: Extract project
    run: |
      mkdir -p extracted
      unzip -o FFScreenLab-GitHub-Build.zip -d extracted

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v6
    with:
      gradle-version: '8.10.2'

  - name: Fix JVM targets and build
    run: |
      PROJECT_FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
      test -n "$PROJECT_FILE" || { echo "Gradle project not found"; exit 1; }
      PROJECT_DIR=$(dirname "$PROJECT_FILE")
      cd "$PROJECT_DIR"

      sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g; s/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle.kts

      gradle assembleDebug --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: FFScreenLab-APK
      path: extracted/**/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error